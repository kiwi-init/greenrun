name: Echo
description: Composite action fixture
inputs:
  value:
    required: true
outputs:
  echoed:
    value: ${{ steps.echo.outputs.value }}
runs:
  using: composite
  steps:
    - id: echo
      shell: bash
      env:
        VALUE: ${{ inputs.value }}
      run: |
        echo "value=$VALUE" >> "$GITHUB_OUTPUT"
        echo "$VALUE"
