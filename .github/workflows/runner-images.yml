name: Runner images

on:
  push:
    branches: [main]
    paths:
      - images/ubuntu/**
      - .github/workflows/runner-images.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/ubuntu
          file: images/ubuntu/Dockerfile
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/kiwi-init/greenrun-ubuntu:${{ matrix.ubuntu }}-latest
            ghcr.io/kiwi-init/greenrun-ubuntu:${{ matrix.ubuntu }}-${{ steps.date.outputs.value }}
          cache-from: type=gha,scope=ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=ubuntu-${{ matrix.ubuntu }}
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/kiwi-init/greenrun-ubuntu@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kiwi-init/greenrun-ubuntu@${DIGEST}"
